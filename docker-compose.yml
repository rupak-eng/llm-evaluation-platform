# Production topology: Postgres for eval history, eval API, Streamlit dashboard.
# NOTE: no Docker daemon was available in the build environment, so this file
# documents the production deployment; it was validated with `docker compose
# config` semantics by hand, not by running it here.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: llmeval
      POSTGRES_PASSWORD: llmeval
      POSTGRES_DB: llmeval
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmeval"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://llmeval:llmeval@postgres:5432/llmeval
      JUDGE_PROVIDER: stub
    ports:
      - "8020:8020"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://llmeval:llmeval@postgres:5432/llmeval
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "dashboard/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
