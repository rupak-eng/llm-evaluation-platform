[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
# make_fixtures.py is a data-definition file: long string literals are the corpus
"bench/scripts/make_fixtures.py" = ["E501"]
