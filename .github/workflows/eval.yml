name: eval

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
      - name: Lint
        run: .venv/bin/ruff check src tests bench/scripts dashboard
      - name: Unit + integration tests
        run: PYTHONPATH=src .venv/bin/python -m pytest -q

  eval-gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
      - name: Seed calibration set + human labels
        run: PYTHONPATH=src DATABASE_URL="sqlite:///./ci.db" .venv/bin/python bench/scripts/seed.py
      - name: Run eval suite (stub judge, deterministic)
        run: PYTHONPATH=src DATABASE_URL="sqlite:///./ci.db" .venv/bin/python -m llmeval.runner --dataset calibration --judge stub --run-id ci-${{ github.sha }}
      - name: Regression gate vs committed baseline
        # FAILS the build when any criterion drops beyond REGRESSION_MAX_DROP
        # or overall weighted kappa falls below REGRESSION_MIN_KAPPA.
        run: PYTHONPATH=src DATABASE_URL="sqlite:///./ci.db" .venv/bin/python bench/scripts/ci_gate.py
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: bench/results/*.json
